name: Validate self-host source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/prepare-source.test.mjs
      - run: node scripts/prepare-source.mjs

  core:
    runs-on: ubuntu-latest
    services:
      database:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v2
        with:
          version: "0.9.24"
      - run: node scripts/prepare-source.mjs
      - run: uv sync --frozen
        working-directory: .build/honcho
      - run: uv run pytest tests/llm tests/test_security.py tests/test_tiktoken_plain_text.py -q
        working-directory: .build/honcho
        env:
          PYTHON_DOTENV_DISABLED: "1"
          DB_CONNECTION_URI: postgresql+psycopg://postgres@localhost:5432/postgres
          AUTH_USE_AUTH: "false"
          TELEMETRY_ENABLED: "false"
          SENTRY_ENABLED: "false"
          LLM_OPENAI_API_KEY: test-key
          LLM_ANTHROPIC_API_KEY: test-key
