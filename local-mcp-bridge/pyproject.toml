[project]
name = "honcho-local-mcp-bridge"
version = "0.1.0"
description = "Streamable HTTP MCP bridge for the local self-hosted Honcho API"
requires-python = ">=3.11"
dependencies = [
  "fastmcp==3.2.3",
  "httpx==0.28.1",
  "uvicorn==0.44.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2.2,<9",
  "ruff>=0.11.2,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.uv]
package = false
