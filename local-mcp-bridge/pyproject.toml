[project]
name = "honcho-local-mcp-bridge"
version = "0.1.0"
description = "Streamable HTTP MCP bridge for the local self-hosted Honcho API"
requires-python = ">=3.11"
dependencies = [
  "fastmcp==3.2.3",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.12",
  "uvicorn==0.44.0",
]

[project.optional-dependencies]
# Only needed when HONCHO_JEV_GATE is on; jev_gate imports it lazily.
jev = ["typesafe-sdk==0.6.0"]

[dependency-groups]
dev = [
  "pytest>=8.2.2,<9",
  "ruff>=0.11.2,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.uv]
package = false
